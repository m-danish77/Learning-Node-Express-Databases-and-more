<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header>
      <center>
        <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-2">
          Welcome to Home
        </h1>
      </center>
    </header>

    <main>
      <form
        action="/host/add-home"
        method="post"
        class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-md"
      >
        <div class="mb-6">
          <label
            for="house-name"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            House Name
          </label>
          <input
            type="text"
            name="house-name"
            id="house-name"
            placeholder="Enter your House Name"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 outline-none placeholder:text-gray-400"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
          Add Home
        </button>
      </form>
    </main>
  </body>
</html>
